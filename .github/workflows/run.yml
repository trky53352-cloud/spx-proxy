name: Run SPX Flow Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * 1-5'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot script
        run: |
          python main.py
