<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب سيولة وعقود SPX اللحظية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-md bg-[#131b2e] border border-[#1e293b] rounded-2xl p-4 shadow-xl flex flex-col gap-4">
        
        <!-- العنوان الرئيسي -->
        <h1 class="text-center text-emerald-400 font-bold text-lg">مراقب سيولة وعقود SPX اللحظية</h1>

        <!-- سعر SPX -->
        <div class="bg-[#0b0f19] border border-[#1e293b] rounded-xl p-3 text-center">
            <span class="text-xs text-gray-400">سعر SPX الآن:</span>
            <div id="spx-price" class="text-2xl font-black text-amber-400 tracking-wider">--</div>
        </div>

        <!-- تنبيه أعلى سيولة -->
        <div id="top-liquidity-box" class="bg-[#1f1521] border border-rose-900/50 rounded-xl p-3 text-center text-xs">
            🔥 أعلى سيولة حالياً: <span id="top-liquidity-text" class="text-rose-300 font-semibold">جاري الحساب...</span>
        </div>

        <!-- جدول العقود -->
        <div class="overflow-x-auto">
            <table class="w-full text-center text-xs">
                <thead>
                    <tr class="text-gray-400 border-b border-gray-800 pb-2">
                        <th class="py-2">PUT PX</th>
                        <th class="py-2">PUT VOL</th>
                        <th class="py-2">CALL PX</th>
                        <th class="py-2">CALL VOL</th>
                        <th class="py-2">STRIKE</th>
                    </tr>
                </thead>
                <tbody id="rows-container">
                    <!-- الصفوف تُعبأ تلقائياً -->
                </tbody>
            </table>
        </div>

        <!-- تذييل الحالة -->
        <div class="text-center text-[11px] text-gray-400 flex flex-col gap-1 pt-2 border-t border-gray-800">
            <span>التحديث يتم تلقائياً كل دقيقة مع تتبع ذكي لأعلى سيولة</span>
            <span id="data-source-status" class="text-emerald-400 font-medium">🟢 متصل بالبيانات الحية (Live API)</span>
        </div>

    </div>

    <script>
        async function fetchSPXData() {
            try {
                const response = await fetch('/api/spx-data');
                const data = await response.json();

                // تحديث سعر المؤشر
                document.getElementById('spx-price').innerText = data.spx_price;

                // تحديث حالة الاتصال مباشرة من السيرفر بدون أي شروط محلية معترضة
                const statusElement = document.getElementById('data-source-status');
                if (statusElement) {
                    statusElement.innerHTML = `🟢 ${data.data_source}`;
                }

                const rows = data.rows || [];
                const tbody = document.getElementById('rows-container');
                tbody.innerHTML = '';

                // إيجاد أعلى سيولة (مجموع الكول + البوت أو مجموع الفوليوم) للمقارنة والتظليل
                let maxVol = -1;
                let topRow = null;

                rows.forEach(r => {
                    const totalVol = r.call_vol + r.put_vol;
                    if (totalVol > maxVol) {
                        maxVol = totalVol;
                        topRow = r;
                    }
                });

                if (topRow) {
                    document.getElementById('top-liquidity-text').innerText = 
                        `Strike ${topRow.strike} (فوليوم كول: ${topRow.call_vol} | بوت: ${topRow.put_vol})`;
                }

                // بناء صفوف الجدول
                rows.forEach(r => {
                    const isTop = topRow && r.strike === topRow.strike;
                    const rowClass = isTop ? 'bg-[#3b2721]/80 border-y border-amber-500/40 font-bold' : 'border-b border-gray-900/50 hover:bg-gray-800/30';

                    const tr = document.createElement('tr');
                    tr.className = rowClass;
                    tr.innerHTML = `
                        <td class="py-2.5 text-gray-300">${r.put_px}</td>
                        <td class="py-2.5 text-rose-400 font-semibold">${r.put_vol}</td>
                        <td class="py-2.5 text-gray-300">${r.call_px}</td>
                        <td class="py-2.5 text-emerald-400 font-semibold">${r.call_vol}</td>
                        <td class="py-2.5 text-amber-400 font-bold">${r.strike}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error fetching SPX data:", error);
            }
        }

        // جلب البيانات فوراً ثم كل 60 ثانية
        fetchSPXData();
        setInterval(fetchSPXData, 60000);
    </script>
</body>
</html>
