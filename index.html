<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب سيولة SPX & ناسداك</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #070b14; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 gap-4">

    <div class="w-full max-w-4xl flex flex-col md:flex-row gap-4 justify-center">
        
        <!-- قسم SPX -->
        <div class="flex-1 bg-[#0d1424] border border-[#1e293b] rounded-2xl p-4 shadow-2xl flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h1 class="text-emerald-400 font-bold text-sm">مؤشر S&P 500 (SPX)</h1>
                <span class="text-[10px] text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-800">🟢 Live</span>
            </div>
            <div class="bg-[#070b14] border border-emerald-900/50 rounded-xl p-2.5 text-center">
                <span class="text-[11px] text-gray-400 block mb-0.5">السعر الآن</span>
                <div id="spx-price" class="text-2xl font-black text-amber-400 tracking-wider">--</div>
            </div>
            <div class="flex flex-col gap-2" id="spx-rows-container"></div>
            <div class="bg-[#111827] border border-gray-800 rounded-xl p-2.5 flex justify-between items-center text-xs">
                <span class="text-gray-400 font-bold">المجموع الإجمالي:</span>
                <div class="flex gap-3">
                    <span class="text-emerald-400 font-bold">C: <span id="spx-total-calls">--</span></span>
                    <span class="text-rose-400 font-bold">P: <span id="spx-total-puts">--</span></span>
                </div>
            </div>
        </div>

        <!-- قسم ناسداك (NDX) -->
        <div class="flex-1 bg-[#0d1424] border border-[#1e293b] rounded-2xl p-4 shadow-2xl flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h1 class="text-emerald-400 font-bold text-sm">مؤشر ناسداك (NDX)</h1>
                <span class="text-[10px] text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-800">🟢 Live</span>
            </div>
            <div class="bg-[#070b14] border border-emerald-900/50 rounded-xl p-2.5 text-center">
                <span class="text-[11px] text-gray-400 block mb-0.5">السعر الآن</span>
                <div id="ndx-price" class="text-2xl font-black text-amber-400 tracking-wider">--</div>
            </div>
            <div class="flex flex-col gap-2" id="ndx-rows-container"></div>
            <div class="bg-[#111827] border border-gray-800 rounded-xl p-2.5 flex justify-between items-center text-xs">
                <span class="text-gray-400 font-bold">المجموع الإجمالي:</span>
                <div class="flex gap-3">
                    <span class="text-emerald-400 font-bold">C: <span id="ndx-total-calls">--</span></span>
                    <span class="text-rose-400 font-bold">P: <span id="ndx-total-puts">--</span></span>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center text-[11px] text-gray-500 pb-2">
        التحديث التلقائي للبيانات: <span class="text-emerald-400 font-medium">كل دقيقة (1m)</span>
    </div>

    <script>
        function formatK(val) {
            return (val / 1000).toFixed(0) + 'K';
        }

        function renderRows(containerId, rows) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            rows.forEach(r => {
                const rowDiv = document.createElement('div');
                rowDiv.className = "flex items-center justify-between bg-[#111827] p-2 rounded-xl border border-gray-800 text-xs";
                rowDiv.innerHTML = `
                    <div class="w-14 font-bold text-amber-400 text-xs tracking-wide">${r.strike}</div>
                    <div class="flex-1 px-2 flex flex-col gap-1">
                        <div class="flex justify-between text-[10px]">
                            <span class="text-emerald-400 font-semibold">C: ${formatK(r.call_vol)}</span>
                            <span class="text-rose-400 font-semibold">P: ${formatK(r.put_vol)}</span>
                        </div>
                        <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden flex">
                            <div class="bg-emerald-500 h-full" style="width: 55%;"></div>
                            <div class="bg-rose-500 h-full" style="width: 45%;"></div>
                        </div>
                    </div>
                    <div class="w-16 text-left font-mono flex justify-end gap-1 text-[11px]">
                        <span class="text-emerald-300">${r.call_px}</span>
                        <span class="text-gray-600">/</span>
                        <span class="text-rose-300">${r.put_px}</span>
                    </div>
                `;
                container.appendChild(rowDiv);
            });
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/spx-data');
                const data = await response.json();

                // تحديث SPX
                document.getElementById('spx-price').innerText = data.spx.price;
                document.getElementById('spx-total-calls').innerText = formatK(data.spx.total_call_vol);
                document.getElementById('spx-total-puts').innerText = formatK(data.spx.total_put_vol);
                renderRows('spx-rows-container', data.spx.rows);

                // تحديث ناسداك
                document.getElementById('ndx-price').innerText = data.ndx.price;
                document.getElementById('ndx-total-calls').innerText = formatK(data.ndx.total_call_vol);
                document.getElementById('ndx-total-puts').innerText = formatK(data.ndx.total_put_vol);
                renderRows('ndx-rows-container', data.ndx.rows);

            } catch (e) {
                console.error(e);
            }
        }

        fetchData();
        setInterval(fetchData, 60 * 1000);
    </script>
</body>
</html>
