<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب سيولة وعقود SPX</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #070b14; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3">

    <div class="w-full max-w-md bg-[#0d1424] border border-[#1e293b] rounded-2xl p-4 shadow-2xl flex flex-col gap-4">
        
        <div class="flex justify-between items-center border-b border-gray-800 pb-3">
            <h1 class="text-emerald-400 font-bold text-sm">مراقب سيولة وعقود SPX</h1>
            <span class="text-xs text-emerald-400 bg-emerald-950 px-2.5 py-0.5 rounded-full border border-emerald-800">🟢 Live API</span>
        </div>

        <div class="bg-[#070b14] border border-emerald-900/50 rounded-xl p-3 text-center">
            <span class="text-xs text-gray-400 block mb-1">سعر SPX الآن</span>
            <div id="spx-price" class="text-3xl font-black text-amber-400 tracking-wider">7,626.00</div>
        </div>

        <div class="flex flex-col gap-2" id="rows-container">
            <!-- تعبئة تلقائية -->
        </div>

        <div class="text-center text-[11px] text-gray-500 pt-2 border-t border-gray-800 flex justify-between">
            <span>التحديث التلقائي</span>
            <span class="text-emerald-400 font-medium">كل دقيقة (1m)</span>
        </div>

    </div>

    <script>
        function formatK(val) {
            return (val / 1000).toFixed(0) + 'K';
        }

        async function fetchSPXData() {
            try {
                const response = await fetch('/api/spx-data');
                const data = await response.json();

                document.getElementById('spx-price').innerText = data.spx_price;
                const container = document.getElementById('rows-container');
                container.innerHTML = '';

                data.rows.forEach(r => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = "flex items-center justify-between bg-[#111827] p-2.5 rounded-xl border border-gray-800 text-xs";
                    
                    rowDiv.innerHTML = `
                        <div class="w-14 font-bold text-amber-400 text-sm tracking-wide">${r.strike}</div>
                        <div class="flex-1 px-3 flex flex-col gap-1">
                            <div class="flex justify-between text-[11px]">
                                <span class="text-emerald-400 font-semibold">C: ${formatK(r.call_vol)}</span>
                                <span class="text-rose-400 font-semibold">P: ${formatK(r.put_vol)}</span>
                            </div>
                            <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden flex">
                                <div class="bg-emerald-500 h-full" style="width: 55%;"></div>
                                <div class="bg-rose-500 h-full" style="width: 45%;"></div>
                            </div>
                        </div>
                        <div class="w-20 text-left font-mono flex justify-end gap-1.5 text-xs">
                            <span class="text-emerald-300">${r.call_px}</span>
                            <span class="text-gray-600">/</span>
                            <span class="text-rose-300">${r.put_px}</span>
                        </div>
                    `;
                    container.appendChild(rowDiv);
                });
            } catch (e) {
                console.error(e);
            }
        }

        fetchSPXData();
        // التحديث كل دقيقة (60,000 ميللي ثانية)
        setInterval(fetchSPXData, 60 * 1000);
    </script>
</body>
</html>
