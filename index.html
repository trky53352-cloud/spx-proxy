<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPX Flow & Liquidity Monitor</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #131b2e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #00ffcc;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .spot-price {
            text-align: center;
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            color: #facc15;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #1e293b;
            font-size: 14px;
        }
        th {
            background: #1e293b;
            color: #38bdf8;
        }
        tr:hover {
            background: #1a233a;
        }
        .call-col {
            color: #4ade80;
            font-weight: bold;
        }
        .put-col {
            color: #f87171;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مراقب سيولة وعقود SPX اللحظية</h1>
    
    <div class="spot-price" id="spotPriceDisplay">
        سعر SPX الآن: 7,686.62
    </div>

    <table>
        <thead>
            <tr>
                <th>STRIKE</th>
                <th>CALL VOL</th>
                <th>CALL PX</th>
                <th>PUT VOL</th>
                <th>PUT PX</th>
            </tr>
        </thead>
        <tbody id="flowTableBody">
            </tbody>
    </table>

    <div class="footer">
        التحديث يتم تلقائياً عبر سحابة المراقبة الذكية
    </div>
</div>

<script>
    // بيانات تجريبية مطابقة للصورة والتحليل اللحظي
    const flowData = [
        { strike: 7690, c_vol: 87, c_px: 29.70, p_vol: 19, p_px: 0.45 },
        { strike: 7685, c_vol: 115, c_px: 24.90, p_vol: 34, p_px: 0.65 },
        { strike: 7680, c_vol: 145, c_px: 20.20, p_vol: 33, p_px: 1.00 },
        { strike: 7675, c_vol: 141, c_px: 15.80, p_vol: 15, p_px: 1.65 },
        { strike: 7670, c_vol: 108, c_px: 12.10, p_vol: 2, p_px: 2.70 },
        { strike: 7665, c_vol: 95, c_px: 8.60, p_vol: 44, p_px: 4.40 },
        { strike: 7660, c_vol: 3058, c_px: 6.00, p_vol: 36, p_px: 92.06 }
    ];

    const tbody = document.getElementById('flowTableBody');
    
    flowData.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-weight:bold; color:#e2e8f0;">${row.strike}</td>
            <td class="call-col">${row.c_vol}</td>
            <td>${row.c_px.toFixed(2)}</td>
            <td class="put-col">${row.p_vol}</td>
            <td>${row.p_px.toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
    });
</script>

</body>
</html>
<script>
  // دالة لجلب البيانات وتحديث الواجهة كل 10 ثوانٍ مثلاً
  function updateDashboard() {
    fetch('/api/spx-data')
      .then(response => response.json())
      .then(data => {
        // هنا يمكنك تحديث العناصر الموجودة في الصفحة بالسعر الجديد أو بيانات العقود الواردة من الـ API
        console.log("تم تحديث البيانات بنجاح:", data);
        
        // مثال: لو كنت تريد تحديث سعر SPX بشكل آلي في العنصر الخاص به
        // document.getElementById('spx-price').innerText = data.price;
      })
      .catch(error => console.error('خطأ في جلب البيانات:', error));
  }

  // تشغيل التحديث التلقائي كل 10000 ميلي ثانية (10 ثوانٍ)
  setInterval(updateDashboard, 10000);
</script>
