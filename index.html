<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب سيولة وعقود الأسواق والمؤشرات</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #070b14; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 gap-4">

    <h1 class="text-emerald-400 font-bold text-lg text-center mt-2">⚡ مراقب السيولة والسترايكات اللحظي</h1>

    <div class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        
        <!-- مولد البطاقات للأصول المختلفة -->
        <script>
            const assets = [
                { id: 'spx', title: 'مؤشر S&P 500 (SPX)' },
                { id: 'ndx', title: 'مؤشر ناسداك (NDX)' },
                { id: 'qqq', title: 'صندوق ناسداك (QQQ)' },
                { id: 'tsla', title: 'سهم تسلا (TSLA)' },
                { id: 'lcid', title: 'سهم لوسيد (LCID)' }
            ];

            assets.forEach(asset => {
                document.write(`
                    <div class="bg-[#0d1424] border border-[#1e293b] rounded-2xl p-3 shadow-xl flex flex-col gap-2.5">
                        <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                            <span class="text-emerald-400 font-bold text-xs">${asset.title}</span>
                            <span class="text-[9px] text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-800">🟢 Live</span>
                        </div>
                        <div class="bg-[#070b14] border border-emerald-900/50 rounded-xl p-2 text-center">
                            <span class="text-[10px] text-gray-400 block mb-0.5">السعر الآن</span>
                            <div id="${asset.id}-price" class="text-xl font-black text-amber-400 tracking-wider">--</div>
                        </div>
                        <div class="flex flex-col gap-1.5" id="${asset.id}-rows-container"></div>
                        <div class="bg-[#111827] border border-gray-800 rounded-xl p-2 flex justify-between items-center text-[11px]">
                            <span class="text-gray-400 font-bold">المجموع:</span>
                            <div class="flex gap-2">
                                <span class="text-emerald-400 font-bold">C: <span id="${asset.id}-total-calls">--</span></span>
                                <span class="text-rose-400 font-bold">P: <span id="${asset.id}-total-puts">--</span></span>
                            </div>
                        </div>
                    </div>
                `);
            });
        </script>

    </div>

    <div class="text-center text-[11px] text-gray-500 py-2">
        التحديث التلقائي للبيانات: <span class="text-emerald-400 font-medium">كل دقيقة (1m)</span>
    </div>

    <script>
        function formatK(val) {
            return (val / 1000).toFixed(0) + 'K';
        }

        function renderRows(containerId, rows) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            rows.forEach(r => {
                const rowDiv = document.createElement('div');
                rowDiv.className = "flex items-center justify-between bg-[#111827] p-2 rounded-lg border border-gray-800 text-[11px]";
                rowDiv.innerHTML = `
                    <div class="w-14 font-bold text-amber-400 tracking-wide">${r.strike}</div>
                    <div class="flex-1 px-2 flex flex-col gap-1">
                        <div class="flex justify-between text-[9px]">
                            <span class="text-emerald-400 font-semibold">C: ${formatK(r.call_vol)}</span>
                            <span class="text-rose-400 font-semibold">P: ${formatK(r.put_vol)}</span>
                        </div>
                        <div class="w-full bg-gray-800 h-1 rounded-full overflow-hidden flex">
                            <div class="bg-emerald-500 h-full" style="width: 55%;"></div>
                            <div class="bg-rose-500 h-full" style="width: 45%;"></div>
                        </div>
                    </div>
                    <div class="w-16 text-left font-mono flex justify-end gap-1 text-[10px]">
                        <span class="text-emerald-300">${r.call_px}</span>
                        <span class="text-gray-600">/</span>
                        <span class="text-rose-300">${r.put_px}</span>
                    </div>
                `;
                container.appendChild(rowDiv);
            });
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/spx-data');
                const data = await response.json();

                ['spx', 'ndx', 'qqq', 'tsla', 'lcid'].forEach(key => {
                    if (data[key]) {
                        document.getElementById(`${key}-price`).innerText = data[key].price;
                        document.getElementById(`${key}-total-calls`).innerText = formatK(data[key].total_call_vol);
                        document.getElementById(`${key}-total-puts`).innerText = formatK(data[key].total_put_vol);
                        renderRows(`${key}-rows-container`, data[key].rows);
                    }
                });

            } catch (e) {
                console.error(e);
            }
        }

        fetchData();
        setInterval(fetchData, 60 * 1000);
    </script>
</body>
</html>
