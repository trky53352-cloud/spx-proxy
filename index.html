<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب سيولة وعقود SPX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0B0F19;
            color: #ffffff;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #111827;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-size: 1.25rem;
            color: #34D399;
            margin-bottom: 16px;
        }
        .price-card {
            background: #1F2937;
            border: 2px solid #374151;
            border-radius: 12px;
            text-align: center;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #FBBF24;
            margin-bottom: 12px;
        }
        .alert-card {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #EF4444;
            border-radius: 10px;
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
            color: #F87171;
            margin-bottom: 16px;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
        }
        th {
            color: #9CA3AF;
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 1px solid #374151;
            font-size: 0.85rem;
        }
        td {
            padding: 10px 4px;
            border-bottom: 1px solid #1F2937;
        }
        tr.highlight {
            background: rgba(245, 158, 11, 0.15);
            border: 2px solid #F59E0B;
        }
        tr.highlight td {
            color: #FBBF24;
            font-weight: bold;
        }
        .call-vol { color: #34D399; }
        .put-vol { color: #F87171; }
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #6B7280;
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مراقب سيولة وعقود SPX اللحظية</h1>
        
        <div class="price-card" id="spxPrice">
            سعر SPX الآن: جاري التحميل...
        </div>
        
        <div class="alert-card" id="topAlert">
            جاري تحليل السيولة...
        </div>

        <table>
            <thead>
                <tr>
                    <th>STRIKE</th>
                    <th>CALL VOL</th>
                    <th>CALL PX</th>
                    <th>PUT VOL</th>
                    <th>PUT PX</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will load here -->
            </tbody>
        </table>

        <div class="footer-note">
            التحديث يتم تلقائياً مع تتبع ذكي لأعلى سيولة
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/spx-data');
                const result = await response.json();
                
                document.getElementById('spxPrice').innerText = `سعر SPX الآن: ${result.spx_price}`;
                
                const rows = result.rows;
                let tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                // البحث عن أعلى Strike بناءً على Call Vol
                let maxVol = -1;
                let maxStrikeObj = null;
                
                rows.forEach(row => {
                    if (row.call_vol > maxVol) {
                        maxVol = row.call_vol;
                        maxStrikeObj = row;
                    }
                });

                if (maxStrikeObj) {
                    document.getElementById('topAlert').innerHTML = `🔥 أعلى سيولة حالياً: Strike ${maxStrikeObj.strike} (شراء Call بفوليم: ${maxStrikeObj.call_vol})`;
                }

                rows.forEach(row => {
                    let isMax = maxStrikeObj && row.strike === maxStrikeObj.strike;
                    let tr = document.createElement('tr');
                    if (isMax) tr.className = 'highlight';
                    
                    tr.innerHTML = `
                        <td>${row.strike}</td>
                        <td class="call-vol">${row.call_vol}</td>
                        <td>${row.call_px}</td>
                        <td class="put-vol">${row.put_vol}</td>
                        <td>${row.put_px}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        fetchData();
        setInterval(fetchData, 10000); // تحديث تلقائي كل 10 ثواني
    </script>
</body>
</html>
