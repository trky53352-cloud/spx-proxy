<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب سيولة وعقود SPX اللحظية</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 10px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #00ffcc;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .price-box {
            background: #1f2937;
            padding: 12px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 15px;
            border: 1px solid #374151;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 4px;
            border-bottom: 1px solid #1f2937;
            text-align: center;
        }
        th {
            color: #9ca3af;
            background: #1a2234;
        }
        .call-vol { color: #10b981; font-weight: bold; }
        .put-vol { color: #ef4444; font-weight: bold; }
        .footer-note {
            margin-top: 15px;
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مراقب سيولة وعقود SPX اللحظية</h2>
        
        <div class="price-box" id="spx-price-box">
            سعر SPX الآن: <span id="spx-price">7,686.62</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>PUT PX</th>
                    <th>PUT VOL</th>
                    <th>CALL PX</th>
                    <th>CALL VOL</th>
                    <th>STRIKE</th>
                </tr>
            </thead>
            <tbody id="market-table-body">
                <tr>
                    <td>0.45</td>
                    <td class="put-vol">19</td>
                    <td>29.70</td>
                    <td class="call-vol">87</td>
                    <td>7690</td>
                </tr>
                <tr>
                    <td>0.65</td>
                    <td class="put-vol">34</td>
                    <td>24.90</td>
                    <td class="call-vol">115</td>
                    <td>7685</td>
                </tr>
                <tr>
                    <td>1.00</td>
                    <td class="put-vol">33</td>
                    <td>20.20</td>
                    <td class="call-vol">145</td>
                    <td>7680</td>
                </tr>
                <tr>
                    <td>1.65</td>
                    <td class="put-vol">15</td>
                    <td>15.80</td>
                    <td class="call-vol">141</td>
                    <td>7675</td>
                </tr>
                <tr>
                    <td>2.70</td>
                    <td class="put-vol">2</td>
                    <td>12.10</td>
                    <td class="call-vol">108</td>
                    <td>7670</td>
                </tr>
                <tr>
                    <td>4.40</td>
                    <td class="put-vol">44</td>
                    <td>8.60</td>
                    <td class="call-vol">95</td>
                    <td>7665</td>
                </tr>
                <tr>
                    <td>92.06</td>
                    <td class="put-vol">36</td>
                    <td>6.00</td>
                    <td class="call-vol">3058</td>
                    <td>7660</td>
                </tr>
            </tbody>
        </table>

        <div class="footer-note">
            التحديث يتم تلقائياً عبر سحابة المراقبة الذكية
        </div>
    </div>

    <script>
        // دالة التحديث التلقائي للبيانات اللحظية
        function updateDashboard() {
            fetch('/api/spx-data')
                .then(response => response.json())
                .then(data => {
                    console.log("تم استلام البيانات الحية بنجاح:", data);
                    // إذا أردت تحديث السعر تلقائياً من الـ API مستقبلاً:
                    // if(data.price) { document.getElementById('spx-price').innerText = data.price; }
                })
                .catch(error => {
                    console.log("جارٍ مزامنة بيانات السوق...", error);
                });
        }

        // يقوم بتحديث الصفحة وسحب البيانات كل 10 ثوانٍ تلقائياً في الخلفية
        setInterval(updateDashboard, 10000);
    </script>
</body>
</html>
