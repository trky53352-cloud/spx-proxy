<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب سيولة وعقود SPX اللحظية</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 10px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #00ffcc;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .price-box {
            background: #1f2937;
            padding: 12px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 15px;
            border: 1px solid #374151;
        }
        .alert-banner {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 4px;
            border-bottom: 1px solid #1f2937;
            text-align: center;
        }
        th {
            color: #9ca3af;
            background: #1a2234;
        }
        .call-vol { color: #10b981; font-weight: bold; }
        .put-vol { color: #ef4444; font-weight: bold; }
        
        .highlight-row {
            background-color: rgba(251, 191, 36, 0.15) !important;
            border: 2px solid #fbbf24;
        }
        .highlight-row td {
            border-top: 1px solid #fbbf24;
            border-bottom: 1px solid #fbbf24;
        }

        .footer-note {
            margin-top: 15px;
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مراقب سيولة وعقود SPX اللحظية</h2>
        
        <div class="price-box" id="spx-price-box">
            سعر SPX الآن: <span id="spx-price">جاري التحميل...</span>
        </div>

        <div class="alert-banner" id="alert-box">
            🔥 أعلى تركيز سيولة (فوليم): جاري الاتصال بالسوق...
        </div>

        <table>
            <thead>
                <tr>
                    <th>PUT PX</th>
                    <th>PUT VOL</th>
                    <th>CALL PX</th>
                    <th>CALL VOL</th>
                    <th>STRIKE</th>
                </tr>
            </thead>
            <tbody id="market-table-body">
                <!-- سيتم تعبئة البيانات حياً من الـ API -->
            </tbody>
        </table>

        <div class="footer-note">
            التحديث يتم تلقائياً عبر سحابة المراقبة الذكية
        </div>
    </div>

    <script>
        function fetchMarketData() {
            fetch('/api/spx-data')
                .then(response => response.json())
                .then(data => {
                    // تحديث سعر SPX العام إذا توفر
                    if(data.spx_price) {
                        document.getElementById('spx-price').innerText = data.spx_price;
                    }

                    const tbody = document.getElementById('market-table-body');
                    tbody.innerHTML = ""; // تفريغ الجدول القديم

                    let maxVol = 0;
                    let maxRowNode = null;
                    let maxDetails = "";

                    // افترضنا أن البيانات تأتي على شكل مصفوفة صفوف (rows) من الـ API
                    // إذا كانت البنية مختلفة قليلاً، سنقوم بمطابقتها
                    const rowsData = data.rows || []; 

                    if(rowsData.length === 0) {
                        // بيانات افتراضية في حال عدم توفر مصفوفة لضمان استمرار العرض
                        tbody.innerHTML = `<tr><td colspan="5" style="color:#9ca3af;">لا توجد بيانات متاحة حالياً من المزود</td></tr>`;
                        return;
                    }

                    rowsData.forEach(row => {
                        const tr = document.createElement('tr');
                        
                        const callVol = parseInt(row.call_vol) || 0;
                        const putVol = parseInt(row.put_vol) || 0;
                        const strike = row.strike;

                        tr.innerHTML = `
                            <td>${row.put_px || 0}</td>
                            <td class="put-vol">${putVol}</td>
                            <td>${row.call_px || 0}</td>
                            <td class="call-vol">${callVol}</td>
                            <td>${strike}</td>
                        `;

                        // تتبع أعلى فوليم
                        if (callVol > maxVol) {
                            maxVol = callVol;
                            maxRowNode = tr;
                            maxDetails = `Strike ${strike} (شراء Call بفوليم: ${maxVol})`;
                        }
                        if (putVol > maxVol) {
                            maxVol = putVol;
                            maxRowNode = tr;
                            maxDetails = `Strike ${strike} (بيع Put بفوليم: ${maxVol})`;
                        }

                        tbody.appendChild(tr);
                    });

                    // تمييز أعلى فوليم وإظهار التنبيه
                    if (maxRowNode) {
                        maxRowNode.classList.add('highlight-row');
                        document.getElementById('alert-box').innerHTML = `🚨 أعلى سيولة حالياً: ${maxDetails}`;
                    }

                })
                .catch(error => {
                    console.log("خطأ في جلب بيانات الـ API:", error);
                    document.getElementById('alert-box').innerHTML = `⚠️ جاري إعادة الاتصال بمزود البيانات...`;
                });
        }

        // جلب البيانات فور فتح الصفحة وتحديثها كل 10 ثوانٍ
        fetchMarketData();
        setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
