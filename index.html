<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب سيولة وعقود SPX اللحظية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-[#131b2e] border border-[#1e293b] rounded-2xl p-5 shadow-2xl flex flex-col gap-4">
        
        <!-- العنوان الرئيسي -->
        <h1 class="text-xl font-bold text-center text-[#34d399]">مراقب سيولة وعقود SPX اللحظية</h1>

        <!-- سعر المؤشر -->
        <div id="spx-container" class="bg-[#1e293b] border border-[#334155] rounded-xl p-3 text-center">
            <span class="text-sm text-slate-400">سعر SPX الآن:</span>
            <span id="spx-price" class="text-xl font-bold text-amber-400 mr-2">--</span>
        </div>

        <!-- تنبيه أعلى سيولة -->
        <div id="top-alert" class="bg-rose-950/40 border border-rose-800/60 rounded-xl p-3 text-center text-sm text-rose-200">
            جاري جلب أعلى سيولة...
        </div>

        <!-- الجدول -->
        <div class="overflow-x-auto">
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="text-xs text-slate-400 border-b border-slate-700/60">
                        <th class="py-2 px-1">PUT PX</th>
                        <th class="py-2 px-1">PUT VOL</th>
                        <th class="py-2 px-1">CALL PX</th>
                        <th class="py-2 px-1">CALL VOL</th>
                        <th class="py-2 px-1">STRIKE</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="text-sm">
                    <!-- سيتم تعبئة الصفوف برمجياً -->
                </tbody>
            </table>
        </div>

        <!-- تذييل -->
        <div class="text-center text-xs text-slate-500 pt-1">
            التحديث يتم تلقائياً مع تتبع ذكي لأعلى سيولة
        </div>

    </div>

    <script>
        function updateDashboard() {
            fetch('/api/spx-data')
                .then(response => response.json())
                .then(data => {
                    if (!data || !data.rows) return;

                    // تحديث سعر المؤشر
                    document.getElementById('spx-price').innerText = data.spx_price;

                    const tbody = document.getElementById('table-body');
                    tbody.innerHTML = '';

                    let maxTotalVol = -1;
                    let topStrikeInfo = null;

                    // حساب أعلى سيولة (مجموع فوليوم الكول والبوت أو الكول لوحده حسب رغبتك)
                    data.rows.forEach(row => {
                        const totalVol = (row.call_vol || 0) + (row.put_vol || 0);
                        if (totalVol > maxTotalVol) {
                            maxTotalVol = totalVol;
                            topStrikeInfo = row;
                        }
                    });

                    // رسم الصفوف
                    data.rows.forEach(row => {
                        const isTop = topStrikeInfo && row.strike === topStrikeInfo.strike;
                        const tr = document.createElement('tr');
                        
                        tr.className = `border-b border-slate-800/50 transition-colors ${
                            isTop ? 'border-2 border-amber-500 bg-amber-500/10 font-bold' : 'hover:bg-slate-800/30'
                        }`;

                        tr.innerHTML = `
                            <td class="py-3 px-1 text-slate-300">${row.put_px}</td>
                            <td class="py-3 px-1 text-rose-400 font-semibold">${row.put_vol}</td>
                            <td class="py-3 px-1 text-slate-300">${row.call_px}</td>
                            <td class="py-3 px-1 text-emerald-400 font-semibold">${row.call_vol}</td>
                            <td class="py-3 px-1 text-amber-300 font-bold">${row.strike}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    // تحديث شريط التنبيه العبوي لأعلى سيولة
                    if (topStrikeInfo) {
                        const alertBox = document.getElementById('top-alert');
                        alertBox.innerHTML = `🔥 أعلى سيولة حالياً: Strike ${topStrikeInfo.strike} (فوليوم كول: ${topStrikeInfo.call_vol} | بوت: ${topStrikeInfo.put_vol})`;
                    }
                })
                .catch(err => console.error('خطأ في جلب البيانات:', err));
        }

        // تشغيل فوري عند فتح الصفحة
        updateDashboard();

        // تحديث تلقائي كل 3 ثوانٍ
        setInterval(updateDashboard, 3000);
    </script>
</body>
</html>
